
name: RDP Gamer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gamer-rdp:
    runs-on: windows-latest
    timeout-minutes: 43000

    steps:
      - name: Configure Windows Gaming
        shell: pwsh
        run: |
          # Ativar RDP mantendo NLA habilitado
          Set-ItemProperty `
            -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' `
            -Name fDenyTSConnections -Value 0

          Set-ItemProperty `
            -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name UserAuthentication -Value 1

          # Otimizações visuais moderadas
          Set-ItemProperty `
            -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects' `
            -Name VisualFXSetting -Value 2

          # Plano de energia de alto desempenho, se disponível
          powercfg /setactive SCHEME_MIN

          # Regra de firewall limitada aos IPs privados do Tailscale
          Get-NetFirewallRule -DisplayName 'RDP-Gamer-Tailscale' `
            -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule

          New-NetFirewallRule `
            -DisplayName 'RDP-Gamer-Tailscale' `
            -Direction Inbound `
            -Action Allow `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress 100.64.0.0/10 `
            -Profile Any

          Write-Host "Configuração do Windows concluída."

      - name: Create RDP Account
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "Configure o segredo RDP_PASSWORD no GitHub."
          }

          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          $user = Get-LocalUser -Name RDP `
            -ErrorAction SilentlyContinue

          if ($user) {
            Set-LocalUser -Name RDP -Password $securePassword
          } else {
            New-LocalUser -Name RDP `
              -Password $securePassword `
              -Description "Gaming Remote Desktop" `
              -PasswordNeverExpires
          }

          Add-LocalGroupMember -Group "Administrators" `
            -Member RDP -ErrorAction SilentlyContinue

          Add-LocalGroupMember -Group "Remote Desktop Users" `
            -Member RDP -ErrorAction SilentlyContinue

          Write-Host "Conta RDP configurada."

      - name: Install Tailscale
        shell: pwsh
        run: |
          $installer = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile $installer

          $process = Start-Process msiexec.exe `
            -ArgumentList "/i `"$installer`" /quiet /norestart" `
            -Wait -PassThru

          Remove-Item $installer -Force `
            -ErrorAction SilentlyContinue

          if ($process.ExitCode -notin @(0, 3010)) {
            throw "Falha na instalação do Tailscale: $($process.ExitCode)"
          }

      - name: Connect Tailscale
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
            throw "Configure o segredo TAILSCALE_AUTH_KEY."
          }

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          $service = Get-Service -Name Tailscale `
            -ErrorAction SilentlyContinue

          if ($service -and $service.Status -ne 'Running') {
            Start-Service Tailscale
          }

          & $ts up "--authkey=$env:TS_AUTHKEY" `
            "--hostname=rdp-gamer-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
            throw "Não foi possível conectar ao Tailscale."
          }

          $ip = $null

          for ($i = 0; $i -lt 20 -and -not $ip; $i++) {
            Start-Sleep -Seconds 3
            $result = & $ts ip -4
            if ($LASTEXITCODE -eq 0 -and $result) {
              $ip = ($result | Select-Object -First 1).Trim()
            }
          }

          if (-not $ip) {
            throw "O Tailscale não atribuiu um IP."
          }

          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV
          Write-Host "Endereço Tailscale: $ip"

      - name: Start and Verify RDP
        shell: pwsh
        run: |
          Set-Service -Name TermService -StartupType Manual

          if ((Get-Service TermService).Status -ne 'Running') {
            Start-Service TermService
          }

          $ready = $false

          for ($i = 0; $i -lt 15; $i++) {
            $test = Test-NetConnection `
              -ComputerName $env:TAILSCALE_IP `
              -Port 3389 `
              -WarningAction SilentlyContinue

            if ($test.TcpTestSucceeded) {
              $ready = $true
              break
            }

            Start-Sleep -Seconds 4
          }

          if (-not $ready) {
            throw "RDP não respondeu na porta 3389. Verifique o serviço e o firewall."
          }

          Write-Host "RDP acessível pelo endereço Tailscale."

      - name: Keep Session Alive
        shell: pwsh
        run: |
          Write-Host "=================================="
          Write-Host "        RDP GAMER ONLINE"
          Write-Host "IP: $env:TAILSCALE_IP"
          Write-Host "Usuário: RDP"
          Write-Host "Senha: use o segredo RDP_PASSWORD"
          Write-Host "=================================="

          while ($true) {
            Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Sessão ativa."
            Start-Sleep -Seconds 60
          }
